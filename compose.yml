services:
  db:
    container_name: arcadia_db
    image: postgres:18.0
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    volumes:
      - db_data:/var/lib/postgresql/
      - ./config.yml:/config.yml:ro
      - ./scripts/config_value.sh:/config_value.sh:ro
    ports:
      - 4321:5432
    environment:
      ARCADIA_CONFIG: /config.yml
    # The postgres image only reads environment variables, so the credentials are extracted
    # from the `database` section of the configuration file before handing over to its
    # regular entrypoint.
    entrypoint:
      - sh
      - -c
      - |
        . /config_value.sh
        export POSTGRES_USER="$$(config_value database user)"
        export POSTGRES_PASSWORD="$$(config_value database password)"
        export POSTGRES_DB="$$(config_value database name)"
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  init_db:
    container_name: init_db
    build:
      context: ./
      dockerfile: backend/api/Dockerfile
      target: builder
    command: sh -c "/init_db.sh"
    working_dir: /app
    volumes:
      - ./backend/storage/scripts/init_db.sh:/init_db.sh
      - ./scripts/config_value.sh:/config_value.sh:ro
      - ./config.yml:/app/config.yml:ro
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis
    container_name: arcadia_redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
      - ./config.yml:/config.yml:ro
      - ./scripts/config_value.sh:/config_value.sh:ro
    environment:
      ARCADIA_CONFIG: /config.yml
    # Same as the db service: the password comes from the `redis` section of the
    # configuration file.
    command:
      - sh
      - -c
      - |
        . /config_value.sh
        exec redis-server --requirepass "$$(config_value redis password)"

  otel-lgtm:
    container_name: arcadia_otel_lgtm
    image: grafana/otel-lgtm:0.17.1
    ports:
      - 3000:3000 # Grafana UI
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP HTTP receiver
    volumes:
      - grafana_data:/data/grafana
      - lgtm_data:/data
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=arcadia
      - GF_AUTH_ANONYMOUS_ENABLED=false

  hostmetrics:
    container_name: arcadia_hostmetrics
    image: otel/opentelemetry-collector-contrib:0.110.0
    restart: always
    pid: host
    privileged: true
    volumes:
      - /:/hostfs:ro
      - ./opentelemetry/hostmetrics.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      otel-lgtm:
        condition: service_started

  backend:
    container_name: arcadia_backend
    build:
      context: ./
      dockerfile: backend/api/Dockerfile
    ports:
      - 8080:8080
    volumes:
      - ./config.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      otel-lgtm:
        condition: service_started
    develop:
      watch:
        - path: ./backend/api
          action: rebuild
        - path: ./config.yml
          action: restart

  tracker:
    container_name: arcadia_tracker
    build:
      context: ./
      dockerfile: tracker/arcadia_tracker/Dockerfile
    ports:
      - 8081:8081
    volumes:
      - ./config.yml:/app/config.yml:ro
    depends_on:
      otel-lgtm:
        condition: service_started
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./tracker/arcadia_tracker
          action: rebuild
        - path: ./config.yml
          action: restart

  frontend:
    container_name: arcadia_frontend
    build:
      # the repository root, so that the build can read config.yml
      context: ./
      dockerfile: frontend/Dockerfile
      secrets:
        - arcadia_config
    ports:
      - 5173:80
    depends_on: # only start after the containers listed in nginx.conf
      backend:
        condition: service_started
      ergo:
        condition: service_started
      kiwiirc:
        condition: service_started 
    develop:
      watch:
        - path: ./frontend/dist
          action: sync
          target: /usr/share/nginx/html
        - path: ./frontend/docker/nginx.conf
          action: sync+restart
          target: /etc/nginx/conf.d/default.conf

  chevereto_database:
    container_name: chevereto_database
    image: mariadb:jammy
    volumes:
      - chevereto_database:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: chevereto
      MYSQL_USER: chevereto
      MYSQL_PASSWORD: arcadia

  chevereto_php:
    container_name: chevereto_php
    image: chevereto/chevereto:4.4.0
    volumes:
      - chevereto_storage:/var/www/html/images/
    restart: always
    depends_on:
      chevereto_database:
        condition: service_healthy
    expose:
      - 80
    ports:
      - 8081:80
    environment:
      CHEVERETO_DB_HOST: chevereto_database
      CHEVERETO_DB_USER: chevereto
      CHEVERETO_DB_PASS: arcadia
      CHEVERETO_DB_PORT: 3306
      CHEVERETO_DB_NAME: chevereto
      CHEVERETO_HOSTNAME: localhost
      CHEVERETO_HOSTNAME_PATH: /
      CHEVERETO_HTTPS: 0

  kiwiirc:
    container_name: kiwiirc
    ports:
      - 8082:80
    build:
      context: kiwiirc
      dockerfile: Dockerfile
    restart: always

  ergo_database:
    container_name: ergo_database
    image: mariadb:jammy
    volumes:
      - ergo_database:/var/lib/mysql
    restart: always
    ports:
      - 3337:3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ergo_history
      MYSQL_USER: ergo
      MYSQL_PASSWORD: ergo_password

  ergo:
    container_name: ergo
    image: ghcr.io/ergochat/ergo:stable
    restart: always
    ports:
      - 6667:6667 # Plain IRC
      - 8089:8089 # HTTP API
      - 8097:8097 # WebSocket (future web client)
    extra_hosts:
      - "host.docker.internal:host-gateway" # needed for the backend to reach ergo, if the backend runs outside and ergo in docker (typical dev setup)
    volumes:
      - ergo_data:/ircd
      - ./ergo/ergo-conf.yaml:/ircd/ircd.yaml:ro
      - ./ergo/ergo.motd:/ircd/ergo.motd:ro
    depends_on:
      ergo_database:
        condition: service_healthy

secrets:
  # Read by the frontend build, which inlines the `frontend` section in the bundle.
  arcadia_config:
    file: ./config.yml

volumes:
  db_data:
  redis_data:
  grafana_data:
  lgtm_data:
  chevereto_database:
  chevereto_storage:
  ergo_data:
  ergo_database:
